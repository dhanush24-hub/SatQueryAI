version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: satquery-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - STORAGE_DIR=/app/storage
      - TORCH_DEVICE=cpu
    volumes:
      - satquery-storage:/app/storage
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: satquery-frontend
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NODE_ENV=production
    command: sh -c "npm install && npm run build && npm run start"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  satquery-storage:
